<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌐 Global Timezone Finder</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; }

  :root {
    --accent1: #6366f1;
    --accent2: #8b5cf6;
    --accent3: #ec4899;
    --india1: #ff9933;
    --india2: #138808;
    --text-dark: #1e1b2e;
    --text-muted: #6b7280;
    --border: rgba(99,102,241,0.15);
  }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #f5f6fb;
    background-image:
      radial-gradient(circle at 15% 15%, rgba(99,102,241,0.08) 0%, transparent 50%),
      radial-gradient(circle at 85% 85%, rgba(236,72,153,0.08) 0%, transparent 50%),
      radial-gradient(circle at 50% 100%, rgba(19,136,8,0.05) 0%, transparent 60%);
    overflow-x: hidden;
    position: relative;
  }

  .particle {
    position: fixed; border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(99,102,241,0.15), transparent 70%);
    filter: blur(1px);
  }

  /* ===== MAIN CARD — now horizontal split ===== */
  .card {
    position: relative;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: 28px;
    width: 100%; max-width: 980px;
    box-shadow: 0 30px 60px rgba(99,102,241,0.12), 0 4px 12px rgba(0,0,0,0.04), inset 0 1px 0 rgba(255,255,255,0.9);
    z-index: 1;
    animation: fadeSlideIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    border: 1px solid rgba(255,255,255,0.6);
    display: flex;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 28px;
    padding: 1.5px;
    background: linear-gradient(135deg, var(--accent1), var(--accent3), var(--india1), var(--accent1));
    background-size: 300% 300%;
    animation: borderFlow 6s ease infinite;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    opacity: 0.6;
  }

  @keyframes borderFlow {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(30px) scale(0.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ===== LEFT PANEL: header + search + chips ===== */
  .left-panel {
    flex: 0 0 38%;
    padding: 44px 34px;
    background: linear-gradient(160deg, rgba(99,102,241,0.05), rgba(236,72,153,0.03));
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .header { text-align: left; margin-bottom: 28px; }

  .header .icon-badge {
    display: inline-flex; align-items: center; justify-content: center;
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent1), var(--accent3));
    font-size: 24px; margin-bottom: 16px;
    box-shadow: 0 8px 24px rgba(99,102,241,0.3);
    animation: iconFloat 3s ease-in-out infinite;
  }

  @keyframes iconFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(5deg); }
  }

  .header h1 {
    font-size: 24px; font-weight: 700; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--text-dark), var(--accent1));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: -0.5px; line-height: 1.3;
  }

  .header p { color: var(--text-muted); font-size: 13px; font-weight: 400; line-height: 1.5; }

  .search-wrapper { position: relative; margin-bottom: 14px; }

  input[type="text"] {
    width: 100%; padding: 15px 50px 15px 18px;
    border-radius: 14px; border: 1.5px solid var(--border);
    background: rgba(99,102,241,0.03); color: var(--text-dark); font-size: 14px;
    outline: none; transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
    font-family: 'Space Grotesk', sans-serif;
  }
  input[type="text"]::placeholder { color: #9ca3af; }
  input[type="text"]:focus {
    border-color: var(--accent1); background: rgba(99,102,241,0.06);
    box-shadow: 0 0 0 4px rgba(99,102,241,0.1), 0 8px 20px rgba(99,102,241,0.1);
  }

  .search-btn {
    position: absolute; right: 5px; top: 5px; bottom: 5px; width: 42px;
    border: none; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent1), var(--accent3));
    color: #fff; font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.25s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 4px 14px rgba(99,102,241,0.35);
  }
  .search-btn:hover { transform: scale(1.06); box-shadow: 0 6px 20px rgba(99,102,241,0.45); }
  .search-btn:active { transform: scale(0.94); }

  .country-counter {
    text-align: left; font-size: 11px; color: var(--text-muted);
    margin-bottom: 18px; display: flex; align-items: center; gap: 6px;
  }

  .suggestions { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    padding: 6px 13px; background: rgba(99,102,241,0.06);
    border: 1px solid var(--border); border-radius: 24px;
    font-size: 11.5px; color: #4b5563; cursor: pointer;
    transition: all 0.25s cubic-bezier(0.16,1,0.3,1); font-weight: 500;
  }
  .chip:hover {
    background: linear-gradient(135deg, rgba(99,102,241,0.15), rgba(236,72,153,0.12));
    color: var(--accent1); border-color: var(--accent1); transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(99,102,241,0.15);
  }

  /* ===== RIGHT PANEL: clocks stacked + diff banner ===== */
  .right-panel {
    flex: 1;
    padding: 44px 36px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }

  .clock-box {
    padding: 24px 24px; border-radius: 18px;
    position: relative; overflow: hidden;
    transition: transform 0.35s cubic-bezier(0.16,1,0.3,1), box-shadow 0.35s ease;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }
  .clock-box:hover { transform: translateX(4px); }

  .clock-box.default {
    background: linear-gradient(100deg, rgba(255,153,51,0.1), rgba(19,136,8,0.06));
    border: 1px solid rgba(255,153,51,0.25);
  }
  .clock-box.default:hover { box-shadow: 0 12px 28px rgba(255,153,51,0.15); }

  .clock-box.searched {
    background: linear-gradient(100deg, rgba(99,102,241,0.1), rgba(236,72,153,0.06));
    border: 1px solid rgba(99,102,241,0.25);
  }
  .clock-box.searched:hover { box-shadow: 0 12px 28px rgba(99,102,241,0.15); }

  .clock-box::after {
    content: ''; position: absolute; top: -50%; right: -30%;
    width: 100%; height: 100%; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.4), transparent 70%);
    pointer-events: none;
  }

  .clock-info { flex: 1; min-width: 0; }

  .label-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .label {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 1.5px;
    color: #9ca3af; font-weight: 700;
  }

  .live-indicator { display: flex; align-items: center; gap: 5px; }
  .live-dot {
    width: 6px; height: 6px; border-radius: 50%; background: #22c55e;
    box-shadow: 0 0 8px rgba(34,197,94,0.6); animation: pulse 1.6s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(34,197,94,0.5), 0 0 8px rgba(34,197,94,0.6); }
    70% { box-shadow: 0 0 0 8px rgba(34,197,94,0), 0 0 8px rgba(34,197,94,0.6); }
    100% { box-shadow: 0 0 0 0 rgba(34,197,94,0), 0 0 8px rgba(34,197,94,0.6); }
  }
  .live-text { font-size: 8.5px; color: #16a34a; font-weight: 700; letter-spacing: 0.5px; }

  .country-name {
    font-size: 16px; font-weight: 700; color: var(--text-dark); margin-bottom: 3px;
    display: flex; align-items: center; gap: 8px;
  }
  .flag { font-size: 20px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.15)); }
  .tz-name {
    font-size: 10px; color: var(--text-muted);
    font-family: 'Orbitron', monospace; letter-spacing: 0.3px; font-weight: 500;
  }
  .placeholder-text { color: #b0b3c1; font-size: 12.5px; font-style: italic; }

  .clock-time-block {
    text-align: right;
    flex-shrink: 0;
  }
  .time-display {
    font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 700;
    color: var(--text-dark); letter-spacing: 1px; margin-bottom: 4px;
    white-space: nowrap;
  }
  .date-display { font-size: 10.5px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }

  .did-you-mean {
    font-size: 10.5px; color: #b45309; margin-bottom: 5px;
    display: flex; align-items: center; gap: 5px;
    animation: fadeSlideIn 0.3s ease;
  }

  .diff-banner {
    padding: 14px 20px; border-radius: 16px;
    background: linear-gradient(100deg, rgba(99,102,241,0.08), rgba(236,72,153,0.05));
    border: 1px solid rgba(99,102,241,0.2);
    display: none; align-items: center; gap: 14px;
  }
  .diff-banner.show { display: flex; animation: fadeSlideIn 0.5s cubic-bezier(0.16,1,0.3,1); }

  .diff-icon {
    width: 40px; height: 40px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent1), var(--accent3));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
    box-shadow: 0 6px 16px rgba(99,102,241,0.3);
  }
  .diff-text { color: var(--text-dark); font-size: 12.5px; line-height: 1.5; }
  .diff-text b {
    font-family: 'Orbitron', sans-serif; color: var(--accent1); font-size: 14px;
  }

  .warning {
    padding: 12px 16px;
    background: linear-gradient(135deg, rgba(251,146,60,0.1), rgba(239,68,68,0.06));
    border: 1px solid rgba(251,146,60,0.3); border-radius: 12px;
    color: #c2410c; font-size: 12px; display: none; align-items: center; gap: 8px;
    font-weight: 500;
  }
  .warning.show { display: flex; animation: fadeSlideIn 0.4s ease; }

  /* ===== RESPONSIVE: stack back to vertical on smaller screens ===== */
  @media (max-width: 820px) {
    .card { flex-direction: column; max-width: 500px; }
    .left-panel {
      flex: none; width: 100%;
      border-right: none; border-bottom: 1px solid var(--border);
      padding: 34px 28px;
    }
    .right-panel { padding: 30px 28px; }
    .header { text-align: center; }
    .header .icon-badge { margin-left: auto; margin-right: auto; display: flex; }
    .suggestions { justify-content: center; }
    .country-counter { justify-content: center; }
    .clock-box { flex-direction: column; align-items: flex-start; gap: 12px; }
    .clock-time-block { text-align: left; }
  }

  @media (max-width: 420px) {
    .time-display { font-size: 21px; }
  }
</style>
</head>

    </div>

    <div class="country-counter">
      <span id="countryCounter"></span>
    </div>

    <div class="suggestions">

  <!-- RIGHT: Clocks + Diff Banner -->

    </div>

    <div class="clock-box searched">

        </div>
        <div id="didYouMeanNote"></div>
        <div class="country-name" id="searchedCountryRow"><span class="placeholder-text">Search a country</span></div>
        <div class="tz-name" id="searchedTz"></div>
      </div>
      <div class="clock-time-block">
        <div class="time-display" id="searchedTime">--:--:--</div>
        <div class="date-display" id="searchedDate"></div>
      </div>
    </div>

    <div class="diff-banner" id="diffBanner">
      <div class="diff-icon">⏱️</div>
      <div class="diff-text" id="diffText"></div>
    </div>

    <div class="warning" id="warningMsg">⚠️ <span id="warningText"></span></div>
  </div>

</div>

    "argentina": ["AR","America/Argentina/Buenos_Aires"], "bolivia": ["BO","America/La_Paz"], "brazil": ["BR","America/Sao_Paulo"],
    "chile": ["CL","America/Santiago"], "colombia": ["CO","America/Bogota"], "ecuador": ["EC","America/Guayaquil"],
    "guyana": ["GY","America/Guyana"], "paraguay": ["PY","America/Asuncion"], "peru": ["PE","America/Lima"],
    "suriname": ["SR","America/Paramaribo"], "uruguay": ["UY","America/Montevideo"], "venezuela": ["VE","America/Caracas"],
    "australia": ["AU","Australia/Sydney"], "fiji": ["FJ","Pacific/Fiji"], "kiribati": ["KI","Pacific/Tarawa"],
    "marshall islands": ["MH","Pacific/Majuro"], "micronesia": ["FM","Pacific/Chuuk"], "nauru": ["NR","Pacific/Nauru"],
    "new zealand": ["NZ","Pacific/Auckland"], "palau": ["PW","Pacific/Palau"], "papua new guinea": ["PG","Pacific/Port_Moresby"],
    "samoa": ["WS","Pacific/Apia"], "solomon islands": ["SB","Pacific/Guadalcanal"], "tonga": ["TO","Pacific/Tongatapu"],
    "tuvalu": ["TV","Pacific/Funafuti"], "vanuatu": ["VU","Pacific/Efate"]
  };

  const INDIA_TZ = "Asia/Kolkata";
  let searchedTz = null;

  function capitalize(str) { return str.replace(/\b\w/g, c => c.toUpperCase()); }

  function getFlagEmoji(code) {
    return String.fromCodePoint(...[...code.toUpperCase()].map(c => 127397 + c.charCodeAt()));
  }

  function formatTime(tz) {
    return new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: tz });
  }
  function formatDate(tz) {
    return new Date().toLocaleDateString('en-US', { weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', timeZone: tz });
  }

  function levenshteinDistance(a, b) {
    const matrix = Array.from({ length: a.length + 1 }, () => []);
    for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
    for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
    for (let i = 1; i <= a.length; i++) {
      for (let j = 1; j <= b.length; j++) {
        matrix[i][j] = a[i-1] === b[j-1] ? matrix[i-1][j-1] :
          1 + Math.min(matrix[i-1][j], matrix[i][j-1], matrix[i-1][j-1]);
      }
    }
    return matrix[a.length][b.length];
  }

  function findClosestCountry(input) {
    const key = input.toLowerCase().trim();
    if (countryData[key]) return { match: key, exact: true };
    let bestMatch = null, bestDistance = Infinity;
    const threshold = Math.max(2, Math.floor(key.length * 0.3));
    for (const name of Object.keys(countryData)) {
      const d = levenshteinDistance(key, name);
      if (d < bestDistance) { bestDistance = d; bestMatch = name; }
    }
    return (bestMatch && bestDistance <= threshold) ? { match: bestMatch, exact: false } : null;
  }

  function getOffsetMinutes(timeZone) {
    const now = new Date();
    const tzDate = new Date(now.toLocaleString('en-US', { timeZone }));
    const utcDate = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
    return Math.round((tzDate - utcDate) / 60000);
  }

  function updateTimeDifference(tzName, label) {
    const indiaOffset = getOffsetMinutes(INDIA_TZ);
    const searchedOffset = getOffsetMinutes(tzName);
    let diff = searchedOffset - indiaOffset;
    const banner = document.getElementById("diffBanner");
    const textEl = document.getElementById("diffText");

    if (diff === 0) {
      textEl.innerHTML = `🎯 <b>${label}</b> is in the <b>same time</b> as India right now!`;
    } else {
      const ahead = diff > 0;
      const absDiff = Math.abs(diff);
      const hours = Math.floor(absDiff / 60);
      const mins = absDiff % 60;
      const timeStr = mins === 0 ? `${hours} hr${hours !== 1 ? 's' : ''}` : `${hours} hr ${mins} min`;
      textEl.innerHTML = ahead
        ? `<b>${label}</b> is <b>${timeStr} ahead</b> of India 🔼`
        : `<b>${label}</b> is <b>${timeStr} behind</b> India 🔽`;
    }
    banner.classList.add("show");
  }

  function tick() {
    document.getElementById("indiaTime").textContent = formatTime(INDIA_TZ);
    document.getElementById("indiaDate").textContent = formatDate(INDIA_TZ);
    if (searchedTz) {
      document.getElementById("searchedTime").textContent = formatTime(searchedTz);
      document.getElementById("searchedDate").textContent = formatDate(searchedTz);
    }
  }

  function showWarning(msg) {
    document.getElementById("warningText").textContent = msg;
    document.getElementById("warningMsg").classList.add("show");
    document.getElementById("diffBanner").classList.remove("show");
  }
  function hideWarning() { document.getElementById("warningMsg").classList.remove("show"); }

  function searchCountry() {
    const input = document.getElementById("countryInput").value.trim();
    if (!input) { showWarning("Please enter a country name to search."); return; }

    const result = findClosestCountry(input);
    const noteBox = document.getElementById("didYouMeanNote");
    noteBox.innerHTML = "";

    if (!result) { showWarning(`"${input}" not found. Try Japan, Brazil, Egypt, Germany, etc.`); return; }

    hideWarning();
    const [code, tz] = countryData[result.match];
    searchedTz = tz;
    const label = capitalize(result.match);

    if (!result.exact) {
      noteBox.innerHTML = `<div class="did-you-mean">✨ Showing "${label}" (you typed "${input}")</div>`;
    }

    document.getElementById("searchedCountryRow").innerHTML = `<span class="flag">${getFlagEmoji(code)}</span> ${label}`;
    document.getElementById("searchedTz").textContent = tz.toUpperCase();
    document.getElementById("searchedIndicator").style.display = "flex";
    document.getElementById("searchedTime").textContent = formatTime(tz);
    document.getElementById("searchedDate").textContent = formatDate(tz);

    updateTimeDifference(tz, label);
  }

  function quickSearch(name) {
    document.getElementById("countryInput").value = name;
    searchCountry();
  }

  const datalist = document.getElementById("countryList");
  Object.keys(countryData).forEach(name => {
    const option = document.createElement("option");
    option.value = capitalize(name);
    datalist.appendChild(option);
  });

  document.getElementById("countryCounter").textContent = `🌍 ${Object.keys(countryData).length} countries available`;

  document.getElementById("countryInput").addEventListener("keypress", e => {
    if (e.key === "Enter") searchCountry();
  });

  setInterval(tick, 1000);
  tick();

  for (let i = 0; i < 20; i++) {
    const p = document.createElement("div");
    p.classList.add("particle");
    const size = Math.random() * 80 + 30;
    p.style.width = size + "px"; p.style.height = size + "px";
    p.style.left = Math.random() * 100 + "vw"; p.style.top = Math.random() * 100 + "vh";
    p.style.animation = `float ${Math.random() * 12 + 12}s linear infinite`;
    document.body.appendChild(p);
  }
  const styleSheet = document.createElement("style");
  styleSheet.textContent = `@keyframes float { 0%,100% { transform: translateY(0) translateX(0);} 50% { transform: translateY(-50px) translateX(25px);} }`;
  document.head.appendChild(styleSheet);
</script>
